name: Publish Python Package to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build pytest

      - name: Run Tests
        run: |
          pytest

      - name: Build binary wheel and source tarball
        run: |
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Uses OpenID Connect (Trusted Publishing) by default via id-token: write.
        # Falls back to PYPI_API_TOKEN secret if Trusted Publisher is not configured.
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
