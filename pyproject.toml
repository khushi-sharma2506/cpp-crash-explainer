[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cpp-crash-explainer"
version = "0.2.1"
description = "Explain C++ AddressSanitizer and LeakSanitizer diagnostic reports in plain English for students and beginners."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Khushi" }
]
keywords = ["c++", "sanitizer", "address-sanitizer", "debugging", "education", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Debuggers",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/khushi-sharma2506/cpp-crash-explainer"
Repository = "https://github.com/khushi-sharma2506/cpp-crash-explainer"
"Bug Tracker" = "https://github.com/khushi-sharma2506/cpp-crash-explainer/issues"

[project.scripts]
cpp-crash-explainer = "cpp_crash_explainer.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
